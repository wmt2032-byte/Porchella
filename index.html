<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porchella Map</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header id="header">
      <div class="snow-layer" aria-hidden="true">
        <span style="--x: 8%; --size: 12; --d: 15s; --delay: 0s;">❄</span>
        <span style="--x: 18%; --size: 10; --d: 18s; --delay: 2s;">❄</span>
        <span style="--x: 28%; --size: 14; --d: 16s; --delay: 4s;">❄</span>
        <span style="--x: 42%; --size: 11; --d: 17s; --delay: 1s;">❄</span>
        <span style="--x: 56%; --size: 13; --d: 19s; --delay: 3s;">❄</span>
        <span style="--x: 68%; --size: 9; --d: 15s; --delay: 5s;">❄</span>
        <span style="--x: 80%; --size: 12; --d: 18s; --delay: 2.5s;">❄</span>
        <span style="--x: 92%; --size: 10; --d: 16s; --delay: 1.5s;">❄</span>
      </div>
      <div class="header-wreath" aria-hidden="true">
        <svg viewBox="0 0 96 96" focusable="false">
          <circle cx="48" cy="48" r="32" fill="none" stroke="#244b2b" stroke-width="7" />
          <g fill="#397442">
            <ellipse cx="48" cy="13" rx="5.5" ry="10" />
            <ellipse cx="48" cy="13" rx="5.5" ry="10" transform="rotate(30 48 48)" />
            <ellipse cx="48" cy="13" rx="5.5" ry="10" transform="rotate(60 48 48)" />
            <ellipse cx="48" cy="13" rx="5.5" ry="10" transform="rotate(90 48 48)" />
            <ellipse cx="48" cy="13" rx="5.5" ry="10" transform="rotate(120 48 48)" />
            <ellipse cx="48" cy="13" rx="5.5" ry="10" transform="rotate(150 48 48)" />
            <ellipse cx="48" cy="13" rx="5.5" ry="10" transform="rotate(180 48 48)" />
            <ellipse cx="48" cy="13" rx="5.5" ry="10" transform="rotate(210 48 48)" />
            <ellipse cx="48" cy="13" rx="5.5" ry="10" transform="rotate(240 48 48)" />
            <ellipse cx="48" cy="13" rx="5.5" ry="10" transform="rotate(270 48 48)" />
            <ellipse cx="48" cy="13" rx="5.5" ry="10" transform="rotate(300 48 48)" />
            <ellipse cx="48" cy="13" rx="5.5" ry="10" transform="rotate(330 48 48)" />
          </g>
          <g fill="#c62828" stroke="#f2b84b" stroke-width="1">
            <circle cx="68" cy="27" r="4" />
            <circle cx="74" cy="33" r="4" />
            <circle cx="66" cy="36" r="4" />
          </g>
          <path d="M45 78c-9-9-17-3-10 3l11 6m5-9c9-9 17-3 10 3l-11 6m-1-9v12"
            fill="#b52828" stroke="#e1b24f" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
        </svg>
      </div>
      <div class="header-group">
        <div class="header-visual">
          <img src="images.jpg" alt="Porchella porch photo" />
        </div>
        <div class="brand-stack">
          <h1>Porchella</h1>
          <span class="year-tag">2026</span>
        </div>
      </div>
      <div id="search-wrap">
        <input id="search" type="text" placeholder="Search porch or artist" aria-label="Search porch or artist" />
        <div id="search-results" class="hidden" aria-live="polite"></div>
      </div>
    </header>

    <div id="layout">
      <aside id="neighborhood-list" aria-label="Neighborhood list"></aside>
      <div id="map" aria-label="Map showing porch locations"></div>

      <aside id="desktop-details">
        <h2 id="desktop-title">Select a porch</h2>
        <div id="desktop-artist-list"></div>
      </aside>

      <div id="empty-right-hint" class="empty-page-hint">
        Select an Address<br>
        or<br>
        Make a Search
      </div>
    </div>

    <div id="backdrop" aria-hidden="true"></div>

    <aside id="side-panel" aria-label="Porch details panel">
      <div id="panel-map"></div>
      <div id="panel-content"></div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>
    <script src="app.js"></script>
  </body>
</html>
